name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m ruff check demandwatch tests scripts
      - run: python -m ruff format --check demandwatch tests scripts
      - run: node --check demandwatch/web/app.js
      - run: python -m demandwatch.cli download
      - run: python -m pytest -q
      - name: Reproduce the full pipeline
        run: python -m demandwatch.cli train --report artifacts/ci/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-evaluation
          path: |
            artifacts/ci/report.json
            artifacts/ci/predictions.csv
            artifacts/current/manifest.json
