[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "demandwatch-ml"
version = "0.1.0"
description = "Reproducible hourly demand forecasting, uncertainty and drift monitoring"
requires-python = ">=3.12"
dependencies = ["scikit-learn>=1.7,<2", "pandas>=2.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
demandwatch = "demandwatch.cli:main"

[tool.setuptools.packages.find]
include = ["demandwatch*"]

[tool.setuptools.package-data]
demandwatch = ["web/*", "web/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
